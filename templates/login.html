{% extends "base.html" %}

{% block title %}Вход в систему - {{ super() }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Вход в систему учёта посещаемости</h3>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="login" class="form-label">Логин:</label>
                        <input type="text" class="form-control" id="login" name="login" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const loginData = {
        login: formData.get('login'),
        password: formData.get('password')
    };
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(loginData)
        });
        
        if (!response.ok) {
            // Try the regular login endpoint as fallback
            const fallbackResponse = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    username: formData.get('login'),
                    password: formData.get('password')
                })
            });
            
            if (!fallbackResponse.ok) {
                throw new Error('Неверный логин или пароль');
            }
            
            const fallbackData = await fallbackResponse.json();
            if (fallbackData.access_token) {
                localStorage.setItem('access_token', fallbackData.access_token);
                // Redirect to dashboard based on role
                window.location.href = '/app';
            } else {
                throw new Error('Ошибка авторизации');
            }
        } else {
            const data = await response.json();
            // Store the token in localStorage or sessionStorage
            if (data.access_token) {
                localStorage.setItem('access_token', data.access_token);
                // Redirect to dashboard based on role
                window.location.href = '/app';
            } else {
                throw new Error('Ошибка авторизации');
            }
        }
    } catch (error) {
        alert(error.message);
    }
});
</script>
{% endblock %}
